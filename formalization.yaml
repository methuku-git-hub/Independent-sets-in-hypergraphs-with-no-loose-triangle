status:
  scope: >-
    Assuming LiPostle34, for every integer r >= 3 there exist c > 0 and N such
    that every n-vertex hypergraph with n >= N, edge sizes between 3 and r,
    and no loose triangle has an independent set of size at least
    c n^(2/3) (log log n)^(1/3). The implication and all of its proof obligations
    are proved. LiPostle34 is an explicit hypothesis, not a custom axiom. The
    manuscript derives the Ramsey bound O_r(t^(3/2)/sqrt(log log t)), resolving
    the 2013 Kostochka–Mubayi–Verstraëte conjecture.

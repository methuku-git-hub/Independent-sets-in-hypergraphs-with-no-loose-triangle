fidelity:
  divergences: Compression uses minimum edge-size sum; quadratic edge count uses n². Sampling uses exact
    finite probability trees. Density uses the sufficient bound d3/(18r), and configuration counts use
    nonoptimal absolute constants. The Li–Postle premise is manuscript Theorem 2.1, not the entire list-coloring
    theorem. The final sufficient parameters use T=(log n)^(1/100), beta=n^(-3/10) and thresholds with
    (log n)^(-1/2), with all eventual estimates proved. Natural ceilings are bounded explicitly.

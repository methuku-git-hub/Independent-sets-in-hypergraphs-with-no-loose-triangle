name: Palomar full preflight (only after proof completion)
on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: 'Truthful repository authorization relationship, supplied by the responsible submitter'
        required: true
        type: string
        default: 'I am a responsible author or maintainer'
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@c02bbeaed888df45c4e28c4e99dba540ad21552a
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: c02bbeaed888df45c4e28c4e99dba540ad21552a
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"comparator.json","authorization_relationship":${{ toJSON(inputs.authorization_relationship) }}}
